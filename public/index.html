<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know Your Constituency</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .gradient-bg { background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%); }
        .card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .loading-spinner { border: 4px solid #f3f3f3; border-top: 4px solid #0ea5e9; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="gradient-bg text-white p-8 rounded-2xl mb-8 flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold mb-2">🏛️ Know Your Constituency</h1>
                <p class="text-sky-100">Ask about Rajarajeshwarinagar (RR Nagar), Bengaluru — answers in English &amp; Kannada.</p>
            </div>
            <div class="mt-4 md:mt-0 text-right">
                <span class="bg-white/20 px-4 py-2 rounded-full text-sm font-medium">CIV-01</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Query -->
            <div class="lg:col-span-1">
                <div class="card p-6">
                    <h2 class="text-xl font-semibold mb-6 flex items-center">
                        <i class="fas fa-circle-question mr-2 text-sky-600"></i> Your Question
                    </h2>
                    <form id="ask-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Ask about your constituency</label>
                            <textarea id="query" rows="4" required placeholder="e.g. What are the key issues in RR Nagar?"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500 outline-none transition resize-none"></textarea>
                        </div>
                        <button type="submit" id="ask-btn"
                            class="w-full gradient-bg text-white font-medium py-3 rounded-lg hover:opacity-90 transition flex items-center justify-center">
                            <i class="fas fa-paper-plane mr-2"></i> Ask
                        </button>
                    </form>

                    <div class="mt-6">
                        <p class="text-xs font-medium text-gray-500 mb-2 uppercase tracking-wide">Try one</p>
                        <div class="flex flex-wrap gap-2">
                            <button type="button" class="suggestion text-xs bg-sky-50 text-sky-700 px-3 py-1.5 rounded-full hover:bg-sky-100 transition" data-query="What are the key issues in RR Nagar?">Key issues</button>
                            <button type="button" class="suggestion text-xs bg-sky-50 text-sky-700 px-3 py-1.5 rounded-full hover:bg-sky-100 transition" data-query="What are the important helpline numbers?">Helplines</button>
                            <button type="button" class="suggestion text-xs bg-sky-50 text-sky-700 px-3 py-1.5 rounded-full hover:bg-sky-100 transition" data-query="Who is the MLA and what wards are covered?">MLA &amp; wards</button>
                            <button type="button" class="suggestion text-xs bg-sky-50 text-sky-700 px-3 py-1.5 rounded-full hover:bg-sky-100 transition" data-query="Give me a general update for residents">Daily update</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Results -->
            <div class="lg:col-span-2">
                <div class="card p-6 min-h-[400px]">
                    <h2 class="text-xl font-semibold mb-6 flex items-center">
                        <i class="fas fa-file-lines mr-2 text-sky-600"></i> Insight
                    </h2>

                    <!-- Empty state -->
                    <div id="empty-state" class="flex flex-col items-center justify-center py-20 text-gray-400">
                        <i class="fas fa-map-location-dot text-5xl mb-4"></i>
                        <p>Ask a question to get a bilingual insight.</p>
                    </div>

                    <!-- Loading -->
                    <div id="loading" class="hidden flex-col items-center justify-center py-20">
                        <div class="loading-spinner mb-4"></div>
                        <p class="text-gray-500">Consulting Gemini…</p>
                    </div>

                    <!-- Results -->
                    <div id="results" class="hidden space-y-6">
                        <div class="bg-sky-50 border border-sky-100 rounded-xl p-5">
                            <h3 class="text-sm font-semibold text-sky-700 mb-2 uppercase tracking-wide">English</h3>
                            <p id="answer-en" class="text-gray-800 whitespace-pre-wrap leading-relaxed"></p>
                        </div>
                        <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-5">
                            <h3 class="text-sm font-semibold text-indigo-700 mb-2 uppercase tracking-wide">ಕನ್ನಡ / Kannada</h3>
                            <p id="answer-kn" class="text-gray-800 whitespace-pre-wrap leading-relaxed"></p>
                        </div>
                        <div id="wa-status" class="text-sm flex items-center text-gray-500"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
